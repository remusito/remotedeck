name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Submódulos
        run: |
          git submodule update --init --depth 1 third-party/chiaki-ng
          git -C third-party/chiaki-ng submodule update --init --depth 1 \
            third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git \
            python3 python3-protobuf protobuf-compiler libssl-dev libopus-dev libsdl2-dev \
            libavcodec-dev libavutil-dev libavformat-dev libswscale-dev libjson-c-dev libminiupnpc-dev libevent-dev libva-dev nasm

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Prueba rápida
        run: ./build/remotedeck --help

      - uses: actions/upload-artifact@v4
        with:
          name: remotedeck-linux-x64
          path: build/remotedeck
